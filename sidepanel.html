<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Fieldcraft</title>
    <style>
      /* Critical boot path — inlined so the boot screen paints on the very
         first frame, before the JS bundle is even requested. React replaces
         this content once it hydrates (no flash: the React-managed boot
         screen renders the same structure). */
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 18px;
        justify-items: center;
      }
      .boot-line {
        width: 44px;
        height: 3px;
        border-radius: 99px;
        overflow: hidden;
        background: #dedbd4;
      }
      .boot-line::after {
        content: "";
        display: block;
        width: 20px;
        height: 100%;
        background: #6557e8;
        border-radius: inherit;
        animation: slide 1s infinite alternate ease-in-out;
      }
      @keyframes slide {
        to { transform: translateX(24px); }
      }
      .brand-mark {
        position: relative;
        width: 29px;
        height: 29px;
        display: inline-block;
        flex: 0 0 29px;
        overflow: hidden;
        border-radius: 9px;
        background: #1c1b20;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
      }
      .brand-mark span { position: absolute; display: block; border-radius: 2px; background: #f7f6f2; }
      .brand-mark span:nth-child(1) { width: 12px; height: 3px; left: 8px; top: 7px; }
      .brand-mark span:nth-child(2) { width: 3px; height: 15px; left: 8px; top: 7px; }
      .brand-mark span:nth-child(3) { width: 9px; height: 3px; left: 8px; top: 13px; background: #9f91ff; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <span class="brand-mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <div class="boot-line"></div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
