name: Extension release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'apps/extension/**'
      - 'packages/config/**'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'turbo.json'
      - '.github/workflows/extension-release.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: avrea-ubuntu-latest-1-vcpu
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --filter fieldcraft-extension check

      - name: Test
        run: bun run --filter fieldcraft-extension test

      - name: Prepare version
        id: prepare_version
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            BUILD_VERSION="${{ github.ref_name }}"
          else
            BUILD_VERSION="${VERSION}+build.${{ github.run_number }}"
          fi
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome extension
        env:
          BUILD_VERSION: ${{ steps.prepare_version.outputs.build_version }}
        run: bun run --filter fieldcraft-extension build

      - name: Package Chrome extension
        id: package
        run: |
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            RELEASE_NAME="Fieldcraft Extension ${{ github.ref_name }}"
          else
            TAG="latest"
            RELEASE_NAME="Fieldcraft Extension Latest"
          fi
          ZIP_VERSION="${{ steps.prepare_version.outputs.build_version }}"
          mkdir -p release
          cd apps/extension/dist
          zip -r "../../../release/fieldcraft-extension-${ZIP_VERSION}.zip" . -x "*.map"
          cp "../../../release/fieldcraft-extension-${ZIP_VERSION}.zip" "../../../release/fieldcraft-extension-latest.zip"
          cd ../..
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_version=${ZIP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Safari extension
        env:
          BUILD_VERSION: ${{ steps.prepare_version.outputs.build_version }}
        run: bun run --filter fieldcraft-extension build:safari

      - name: Package Safari extension
        run: |
          ZIP_VERSION="${{ steps.prepare_version.outputs.build_version }}"
          mkdir -p release
          cd apps/extension/dist
          zip -r "../../../release/fieldcraft-extension-safari-${ZIP_VERSION}.zip" . -x "*.map"
          cp "../../../release/fieldcraft-extension-safari-${ZIP_VERSION}.zip" "../../../release/fieldcraft-extension-safari-latest.zip"
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fieldcraft-extension-${{ github.run_id }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Release latest build
        if: github.ref_type == 'branch'
        uses: IsaacShelton/update-existing-release@v1.3.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.package.outputs.tag }}
          release: ${{ steps.package.outputs.release_name }}
          files: |
            release/fieldcraft-extension-${{ steps.package.outputs.zip_version }}.zip
            release/fieldcraft-extension-latest.zip
            release/fieldcraft-extension-safari-${{ steps.package.outputs.zip_version }}.zip
            release/fieldcraft-extension-safari-latest.zip
          replace: true
          updateTag: true
          body: |
            Automated build from `main` at ${{ github.sha }}.
            - `fieldcraft-extension-latest.zip` — Chrome/Edge (unpacked extension)
            - `fieldcraft-extension-safari-latest.zip` — Safari raw WebExtension bundle (run `xcrun safari-web-extension-converter` on macOS to wrap it in an `.app`)

      - name: Release versioned build
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.release_name }}
          files: |
            release/fieldcraft-extension-${{ steps.package.outputs.zip_version }}.zip
            release/fieldcraft-extension-latest.zip
            release/fieldcraft-extension-safari-${{ steps.package.outputs.zip_version }}.zip
            release/fieldcraft-extension-safari-latest.zip
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
